name: Update Hytale launcher

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Check for a new version
        id: check
        run: |
          manifest=$(curl -fsSL https://launcher.hytale.com/version/release/launcher.json)
          latest=$(jq -r '.version' <<<"$manifest")
          sha256=$(jq -r '.download_url.linux.amd64.sha256' <<<"$manifest")
          current=$(sed -n 's/^ *version = "\(.*\)";/\1/p' flake.nix)

          echo "current=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            exit 0
          fi

          sed -i \
            -e "s|^\( *version = \)\"$current\";|\1\"$latest\";|" \
            -e "/hytale-launcher-zip = /,/};/ s|sha256 = \"[0-9a-f]*\";|sha256 = \"$sha256\";|" \
            flake.nix

          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Update flake inputs
        run: nix flake update

      - name: Build
        id: build
        run: |
          if git diff --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          nix build .#hytale-launcher --no-link -L
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet flake.nix; then
            git commit -m "chore: bump version to \`${{ steps.check.outputs.version }}\`" -- flake.nix
          fi
          if ! git diff --quiet flake.lock; then
            git commit -m "chore: update flake.lock" -- flake.lock
          fi
          git push
